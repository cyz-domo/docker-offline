name: Cleanup Offline Package Releases

on:
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete offline package releases older than 15 days
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 15 * 24 * 60 * 60 * 1000;
            let page = 1;
            while (true) {
              const { data: releases } = await github.rest.repos.listReleases({
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
                page,
              });
              if (!releases.length) break;
              for (const release of releases) {
                if (!release.tag_name.startsWith('offline-')) continue;
                if (Date.parse(release.created_at) >= cutoff) continue;
                await github.rest.repos.deleteRelease({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                });
                try {
                  await github.rest.git.deleteRef({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    ref: `tags/${release.tag_name}`,
                  });
                } catch (error) {
                  core.warning(`无法删除标签 ${release.tag_name}: ${error.message}`);
                }
              }
              if (releases.length < 100) break;
              page += 1;
            }
